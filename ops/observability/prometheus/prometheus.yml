global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    deployment: tele-proxy-local

rule_files:
  - /etc/prometheus/alerts.yml

# Evaluation remains enabled; no Alertmanager target or external notifications.
alerting:
  alertmanagers: []

scrape_configs:
  - job_name: tele-proxy-canary
    metrics_path: /api/metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics-token
    static_configs:
      - targets: ['canary:20128']
        labels:
          environment: canary
    sample_limit: 15000
    label_limit: 16
    label_name_length_limit: 100
    label_value_length_limit: 200
  - job_name: prometheus
    static_configs:
      - targets: ['prometheus:9090']
        labels: {environment: canary}
  - job_name: alloy
    static_configs:
      - targets: ['alloy:12345']
        labels: {environment: canary}
  - job_name: loki
    static_configs:
      - targets: ['loki:3100']
        labels: {environment: canary}
  - job_name: grafana
    static_configs:
      - targets: ['grafana:3000']
        labels: {environment: canary}
  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']
        labels: {environment: canary}
